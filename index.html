<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affy &amp; Gabby — 20 March 2027</title>
<meta name="robots" content="noindex">
<!--
  PLACEHOLDER LAYOUT — intentionally unstyled.
  This exists to prove the RSVP path works end to end. Replace wholesale
  once the theme is decided; don't build on top of these styles.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.6 system-ui, -apple-system, sans-serif;
    max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem 5rem;
  }
  header { text-align: center; margin-bottom: 3rem; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; font-weight: 600; letter-spacing: -.02em; }
  .date { opacity: .7; margin: 0; }
  .tbc { font-size: .875rem; opacity: .5; margin: .25rem 0 0; }
  h2 { font-size: 1.125rem; margin: 2.5rem 0 1rem; }
  label { display: block; margin: 1rem 0 .25rem; font-weight: 500; font-size: .9375rem; }
  .hint { font-weight: 400; opacity: .6; font-size: .8125rem; }
  input, select, textarea, button {
    font: inherit; width: 100%; padding: .55rem .7rem;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    border-radius: 6px; background: transparent; color: inherit;
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  button {
    margin-top: 2rem; padding: .75rem; font-weight: 600; cursor: pointer;
    background: currentColor; border: none;
  }
  button span { color: Canvas; }
  button[disabled] { opacity: .5; cursor: default; }
  .hp { position: absolute; left: -9999px; }
  #status { margin-top: 1rem; text-align: center; min-height: 1.5rem; font-size: .9375rem; }
  #status.error { color: #c0392b; }
  footer { margin-top: 4rem; text-align: center; font-size: .875rem; opacity: .6; }
  footer a { color: inherit; }
</style>
</head>
<body>

<header>
  <h1>Affy &amp; Gabby</h1>
  <p class="date">20 March 2027</p>
  <p class="tbc">Venue and travel details to follow</p>
</header>

<form id="rsvp">
  <h2>RSVP</h2>

  <label for="partyName">Who are you? <span class="hint">— name, or family name</span></label>
  <input id="partyName" name="partyName" required autocomplete="name">

  <label for="attending">Can you make it?</label>
  <select id="attending" name="attending" required>
    <option value="">Choose…</option>
    <option>Yes</option>
    <option>No</option>
    <option>Maybe</option>
  </select>

  <div id="ifYes" hidden>
    <label for="headcount">How many of you?</label>
    <input id="headcount" name="headcount" type="number" min="1" max="12" value="1">

    <label for="guestNames">Names of everyone coming <span class="hint">— for place cards</span></label>
    <textarea id="guestNames" name="guestNames"></textarea>

    <label for="dietary">Dietary requirements <span class="hint">— allergies too</span></label>
    <textarea id="dietary" name="dietary"></textarea>

    <label for="bus">Would you use a coach from Cape Town?</label>
    <select id="bus" name="bus">
      <option value="">Choose…</option>
      <option>Yes</option>
      <option>No</option>
      <option>Not sure yet</option>
    </select>

    <label for="accommodation">Accommodation</label>
    <select id="accommodation" name="accommodation">
      <option value="">Choose…</option>
      <option>Booking our own</option>
      <option>Need help</option>
      <option>Not staying over</option>
    </select>

    <label for="song">A song that will get you dancing</label>
    <input id="song" name="song">
  </div>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email">

  <label for="phone">Phone <span class="hint">— for the day-of group</span></label>
  <input id="phone" name="phone" type="tel" autocomplete="tel">

  <label for="message">Anything you'd like to say to us</label>
  <textarea id="message" name="message"></textarea>

  <!-- honeypot: hidden from people, catnip for bots -->
  <div class="hp" aria-hidden="true">
    <label for="website">Leave this blank</label>
    <input id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit"><span>Send RSVP</span></button>
  <p id="status" role="status"></p>
</form>

<footer>
  <p>Bored? <a href="/game/">Rescue Gabby from an ostrich.</a></p>
</footer>

<script>
const form = document.getElementById('rsvp');
const attending = document.getElementById('attending');
const ifYes = document.getElementById('ifYes');
const status = document.getElementById('status');
const button = form.querySelector('button');

const toggleDetails = () => { ifYes.hidden = attending.value !== 'Yes'; };
attending.addEventListener('change', toggleDetails);
toggleDetails();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  button.disabled = true;
  status.className = '';
  status.textContent = 'Sending…';

  try {
    const res = await fetch('/api/rsvp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData(form))),
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      form.hidden = true;
      status.textContent = attending.value === 'No'
        ? 'Thank you for letting us know — we will miss you.'
        : 'Got it. See you on 20 March 2027.';
    } else {
      throw new Error(data.error || 'Something went wrong.');
    }
  } catch (err) {
    status.className = 'error';
    status.textContent = err.message;
    button.disabled = false;
  }
});
</script>

</body>
</html>
