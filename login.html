<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Affy &amp; Gabby</title>
<meta name="robots" content="noindex">


<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!--
  THE LOGIN PAGE.

  One password box. Which group a guest lands in is derived from which password
  matched — the three tiers are never named on screen, because what separates
  them is who is paying for a room. See js/gate.js for what this gate is and
  is not.

  Guests without a password use "Request access", which posts a name and email
  to /api/access-request. Affy and Gabby's addresses live in that function, not
  here: putting two personal Gmail addresses in public page source is how you
  get them scraped.
-->

<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face {
  font-family: 'Fraunces';
  src: url('fonts/fraunces-var.woff2') format('woff2-variations'),
       url('fonts/fraunces-var.woff2') format('woff2');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('fonts/inter-var.woff2') format('woff2-variations'),
       url('fonts/inter-var.woff2') format('woff2');
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --cream: #f4efe1; --gold: #d9a257; --maroon: #370b0a;
  --ink: #370b0b; --tan: #aa8c6d; --sand: #f0dfc0; --chalk: #f5f0e1;
  --gold-fg: #3a1608; --gold-mute: #6b3d16;
  /* The link colour the front page uses on a gold ground (.practical--gold's
     --pane-link). Named the same here so the two cannot drift. */
  --pane-link: #6e1f27;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0; min-height: 100svh;
  display: grid; place-items: center; padding: 2rem 1.25rem;
  color: var(--gold-fg); font: 17px/1.6 var(--font-body); letter-spacing: -0.25px;
  -webkit-font-smoothing: antialiased;
  /* Gold ground, same as the Holud and RSVP panes on the front page. Every
     colour below flips with it: the type was pale for a darkened photograph
     and would be unreadable on this. */
  background: var(--gold);
}
.card { width: 100%; max-width: 26rem; text-align: center; }
/* Fields line up with the stamp's printed edge rather than its bounding box,
   so the password box and Enter button read as sitting under the stamp instead
   of overhanging it. Both forms take it, so Request access matches. */
:root { --field-w: 83%; }
form { width: var(--field-w); margin-inline: auto; }
.brand {
  margin: 0 0 .4rem; font: 600 11px/1 var(--font-body);
  letter-spacing: 2.4px; text-transform: uppercase; color: var(--gold-mute);
}
/* The heading breaks in one fixed place at every width: "Our African" over
   "adventure awaits". A block span rather than a size tuned to wrap there —
   Fraunces and its Georgia fallback have different metrics, so a size that
   breaks correctly in one can break elsewhere, or not at all, in the other.
   Scoped to #signin: the other h1, "No password?", stays on one line. */
#signin h1 .brk { display: block; }
h1 {
  margin: 1.8rem 0 1.2rem; font-family: var(--font-display); font-weight: 500;
  font-style: italic; font-size: clamp(2.2rem, 8vw, 3rem); line-height: 1.05;
  letter-spacing: -1.5px;
}
/* The stamp fills the card; the artwork inside it does not. The scalloped edge
   sits in the file's own alpha, running from roughly 8.5% to 91.5% of the
   square, so the stamp you can SEE is about 83% of this element — which is why
   --field-w below is 83% and not 100%. No frame or radius here; the border is
   painted into the file.

   The top margin here IS the gap under the heading: it and h1's bottom margin
   are adjacent siblings in normal flow, so they COLLAPSE to the larger of the
   two rather than summing. Raising h1's bottom alone moves nothing until it
   passes this number, so the gap is set here. */
.stamp { display: block; width: 100%; height: auto; margin: 2.9rem 0 2rem; }
.sub { margin: 0 0 2rem; color: var(--gold-mute); font-size: 15px; }

label {
  display: block; margin-bottom: .5rem; text-align: left;
  font: 600 12px/1 var(--font-body); letter-spacing: 1.6px;
  text-transform: uppercase; color: var(--gold-mute);
}
input {
  width: 100%; padding: .95rem 1rem; margin-bottom: 1rem;
  border: 1px solid rgba(58, 22, 8, .28); border-radius: 2px;
  background: #fff6e6; color: var(--gold-fg);
  font: 17px/1.4 var(--font-body);
}
input:focus {
  outline: none; border-color: var(--maroon);
  box-shadow: 0 0 0 3px rgba(55, 11, 10, .18);
}
button {
  width: 100%; padding: 1rem; border: 0; border-radius: 2px; cursor: pointer;
  background: var(--maroon); color: var(--sand);
  font: 600 13px/1 var(--font-body); letter-spacing: 2px; text-transform: uppercase;
  transition: background .2s ease;
}
button:hover:not(:disabled) { background: #52140f; }
button:disabled { opacity: .55; cursor: default; }

/* Styled as a link the way the rest of the site styles links: no underline,
   --pane-link at rest, and the pane foreground on hover — the site carries no
   underline anywhere, so hover IS the affordance (see --link-fade on the front
   page). Still a <button>, because it swaps a panel rather than navigating;
   only the look is borrowed. :focus-visible is included as well as :hover, so
   it answers to the keyboard the same way a real link does. */
.linkish {
  margin-top: 0; background: none; border: 0; padding: .5rem; width: auto;
  color: var(--pane-link); letter-spacing: .4px; text-transform: none;
  font-size: 14px; font-weight: 400; text-decoration: none;
  transition: color .15s ease; cursor: pointer;
}
.linkish:hover, .linkish:focus-visible { background: none; color: var(--gold-fg); }

/* The gap from the Enter button down to "I don't have a password" is 2rem, the
   same step the stamp now holds above the field. It is made of three parts,
   because .msg sits between them: this margin (.3rem) + the reserved message
   line (1.4em of 14px, 19.6px) + .linkish's own .5rem top padding = 32.4px,
   against 2rem = 32px. (It was matched to .sub's margin, but that line came
   out of the sign-in panel — the number is what mattered, not the source.)
   min-height stays: it holds the line open so the page doesn't jump when a
   message appears. Change any one of the three and the match goes. */
.msg { margin: .3rem 0 0; min-height: 1.4em; font-size: 14px; }
.msg[data-tone='bad'] { color: #7d1f14; }
.msg[data-tone='good'] { color: #2f5233; }

[hidden] { display: none !important; }

/* ---- phones: the whole card on one screen ----
   The stamp is square, so on a handset it is the one element that can eat the
   viewport: at 100% of a 26rem card it is as tall as it is wide, and the card
   then runs off the bottom. Capping it against the viewport HEIGHT is what
   makes the rest fit, and because it is square, width and height cap together.

   svh, not vh: on iOS vh is the tall address-bar-collapsed height, so a card
   sized against it overflows on load — which is exactly the bug being fixed.

   Everything else here is a small trim rather than a rethink: the point is that
   nothing needs scrolling, not that the phone gets a different design. */
@media (max-width: 30rem) {
  body { padding: 1.25rem; }
  h1 { font-size: clamp(1.9rem, 8vw, 2.5rem); margin: 1.2rem 0 .8rem; }
  .stamp { width: min(100%, 30svh); margin: 2rem auto 1.5rem; }
  .sub { margin-bottom: 1.4rem; }
  input { padding: .8rem .9rem; margin-bottom: .8rem; }
  button { padding: .85rem; }
}
</style>
</head>
<body>

<main class="card">
  <p class="brand">Affy &amp; Gabby &middot; March 2027</p>

  <!-- ===== password ===== -->
  <section id="signin">
    <!-- The span carries the phone break. On desktop it is inline and the line
         falls where it falls; on a handset it goes block, so the heading reads
         over two lines there the way it does here rather than shrinking onto
         one. A forced break beats sizing it to wrap: type metrics differ
         between the variable face and its Georgia fallback, so a size that
         wraps in Fraunces can sit on one line in the fallback. -->
    <h1>Our African <span class="brk">adventure awaits</span></h1>
    <img class="stamp" src="images/ostrich-stamp.webp" width="660" height="660"
         alt="A postage stamp of an ostrich looking into the camera, mountains behind">
    <form id="loginForm" novalidate>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit">Enter</button>
    </form>

    <p class="msg" id="loginMsg" role="status" aria-live="polite"></p>
    <button type="button" class="linkish" id="showRequest">I don&rsquo;t have a password</button>
  </section>

  <!-- ===== request access ===== -->
  <section id="request" hidden>
    <h1>No password?</h1>
    <p class="sub">Leave your name and email and we&rsquo;ll send you one.</p>

    <form id="requestForm" novalidate>
      <label for="reqName">Full name</label>
      <input id="reqName" name="name" autocomplete="name" required>

      <label for="reqEmail">Email</label>
      <input id="reqEmail" name="email" type="email" autocomplete="email" required>

      <!-- People leave this empty, bots fill it in. -->
      <div style="position:absolute;left:-9999px" aria-hidden="true">
        <label for="website">Leave this blank</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit">Send request</button>
    </form>

    <p class="msg" id="requestMsg" role="status" aria-live="polite"></p>
    <button type="button" class="linkish" id="showSignin">Back to the password</button>
  </section>

</main>

<script src="js/gate.js"></script>
<script>
(() => {
  const signin  = document.getElementById('signin');
  const request = document.getElementById('request');
  const loginForm = document.getElementById('loginForm');
  const loginMsg  = document.getElementById('loginMsg');
  const reqForm   = document.getElementById('requestForm');
  const reqMsg    = document.getElementById('requestMsg');

  const say = (el, text, tone) => { el.textContent = text; el.dataset.tone = tone || ''; };

  // Where to send them once they're in.
  //
  // Default is their own accommodation page — that is what most guests came here
  // for, and it is the one page that can't be linked to before signing in
  // because its URL depends on the group. An explicit ?next= wins, so the RSVP
  // link and the "where to stay" link still land where they pointed.
  //
  // Only ever a path on this site: ?next= comes from the URL bar, so without the
  // check it is an open redirect to anywhere.
  function safeNext() {
    const raw = new URLSearchParams(location.search).get('next');
    if (raw && /^\/(?!\/)/.test(raw)) return raw;
    return AG.stayPath() || '/';
  }

  // Already signed in? Don't make them do it twice.
  if (AG.group()) location.replace(safeNext());

  // Enter submits. The markup should give this for free — one field, one submit
  // button, inside a form — but implicit submission isn't firing here, so it is
  // wired explicitly. preventDefault first, or a browser that DOES submit
  // implicitly would run the handler twice.
  [loginForm, reqForm].forEach((f) => {
    f.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing) return;
      if (e.target.tagName === 'TEXTAREA') return;
      e.preventDefault();
      f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event('submit', { cancelable: true }));
    });
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = loginForm.querySelector('button');
    const value = document.getElementById('password').value;
    if (!value.trim()) return say(loginMsg, 'Pop the password in first.', 'bad');

    btn.disabled = true;
    say(loginMsg, 'Checking…');
    try {
      const group = await AG.login(value);
      if (!group) {
        say(loginMsg, "That's not one we recognise. Check for stray spaces, or ask us for a new one.", 'bad');
        btn.disabled = false;
        return;
      }
      say(loginMsg, 'Lovely. One moment…', 'good');
      location.replace(safeNext());
    } catch (err) {
      // The only throw is a non-secure context, where crypto.subtle is missing.
      say(loginMsg, 'This page needs a secure (https) connection to sign you in.', 'bad');
      btn.disabled = false;
    }
  });

  document.getElementById('showRequest').addEventListener('click', () => {
    signin.hidden = true; request.hidden = false;
    document.getElementById('reqName').focus();
  });
  document.getElementById('showSignin').addEventListener('click', () => {
    request.hidden = true; signin.hidden = false;
    document.getElementById('password').focus();
  });

  reqForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = reqForm.querySelector('button');
    const name = document.getElementById('reqName').value.trim();
    const email = document.getElementById('reqEmail').value.trim();
    if (!name || !email) return say(reqMsg, 'We need both, sorry.', 'bad');

    btn.disabled = true;
    say(reqMsg, 'Sending…');
    try {
      const r = await fetch('/api/access-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, website: document.getElementById('website').value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'failed');
      say(reqMsg, "Got it. We'll send your password over shortly.", 'good');
      reqForm.reset();
    } catch (err) {
      say(reqMsg, "That didn't go through. Give us a nudge on WhatsApp instead and we'll sort you out.", 'bad');
      btn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
