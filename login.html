<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Affy &amp; Gabby</title>
<meta name="robots" content="noindex">


<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!--
  THE LOGIN PAGE.

  One password box. Which group a guest lands in is derived from which password
  matched — the three tiers are never named on screen, because what separates
  them is who is paying for a room. See js/gate.js for what this gate is and
  is not.

  Guests without a password use "Request access", which posts a name and email
  to /api/access-request. Affy and Gabby's addresses live in that function, not
  here: putting two personal Gmail addresses in public page source is how you
  get them scraped.
-->

<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face {
  font-family: 'Fraunces';
  src: url('fonts/fraunces-var.woff2') format('woff2-variations'),
       url('fonts/fraunces-var.woff2') format('woff2');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('fonts/inter-var.woff2') format('woff2-variations'),
       url('fonts/inter-var.woff2') format('woff2');
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --cream: #f4efe1; --gold: #d9a257; --maroon: #370b0a;
  --ink: #370b0b; --tan: #aa8c6d; --sand: #f0dfc0; --chalk: #f5f0e1;
  --gold-fg: #3a1608; --gold-mute: #6b3d16;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0; min-height: 100svh;
  display: grid; place-items: center; padding: 2rem 1.25rem;
  color: var(--gold-fg); font: 17px/1.6 var(--font-body); letter-spacing: -0.25px;
  -webkit-font-smoothing: antialiased;
  /* Gold ground, same as the Holud and RSVP panes on the front page. Every
     colour below flips with it: the type was pale for a darkened photograph
     and would be unreadable on this. */
  background: var(--gold);
}
.card { width: 100%; max-width: 26rem; text-align: center; }
.brand {
  margin: 0 0 .4rem; font: 600 11px/1 var(--font-body);
  letter-spacing: 2.4px; text-transform: uppercase; color: var(--gold-mute);
}
h1 {
  margin: 0 0 .6rem; font-family: var(--font-display); font-weight: 500;
  font-style: italic; font-size: clamp(2.2rem, 8vw, 3rem); line-height: 1.05;
  letter-spacing: -1.5px;
}
/* Width of the password box, which is the card. The stamp's scalloped edge and
   cream border are in the file's own alpha, so no frame or radius here. */
.stamp { display: block; width: 100%; height: auto; margin: 1.2rem 0 1.4rem; }
.sub { margin: 0 0 2rem; color: var(--gold-mute); font-size: 15px; }

label {
  display: block; margin-bottom: .5rem; text-align: left;
  font: 600 12px/1 var(--font-body); letter-spacing: 1.6px;
  text-transform: uppercase; color: var(--gold-mute);
}
input {
  width: 100%; padding: .95rem 1rem; margin-bottom: 1rem;
  border: 1px solid rgba(58, 22, 8, .28); border-radius: 2px;
  background: #fff6e6; color: var(--gold-fg);
  font: 17px/1.4 var(--font-body);
}
input:focus {
  outline: none; border-color: var(--maroon);
  box-shadow: 0 0 0 3px rgba(55, 11, 10, .18);
}
button {
  width: 100%; padding: 1rem; border: 0; border-radius: 2px; cursor: pointer;
  background: var(--maroon); color: var(--sand);
  font: 600 13px/1 var(--font-body); letter-spacing: 2px; text-transform: uppercase;
  transition: background .2s ease;
}
button:hover:not(:disabled) { background: #52140f; }
button:disabled { opacity: .55; cursor: default; }

.linkish {
  margin-top: 1.5rem; background: none; border: 0; padding: .5rem; width: auto;
  color: var(--gold-mute); letter-spacing: .4px; text-transform: none;
  font-size: 14px; font-weight: 400; text-decoration: underline;
  text-underline-offset: 3px; cursor: pointer;
}
.linkish:hover { background: none; color: var(--gold-fg); }

.msg { margin: 1rem 0 0; min-height: 1.4em; font-size: 14px; }
.msg[data-tone='bad'] { color: #7d1f14; }
.msg[data-tone='good'] { color: #2f5233; }

[hidden] { display: none !important; }
</style>
</head>
<body>

<main class="card">
  <p class="brand">Affy &amp; Gabby &middot; March 2027</p>

  <!-- ===== password ===== -->
  <section id="signin">
    <h1>An African adventure awaits</h1>
    <img class="stamp" src="images/ostrich-stamp.webp" width="660" height="660"
         alt="A postage stamp of an ostrich looking into the camera, mountains behind">
    <p class="sub">Login using the password we sent you</p>

    <form id="loginForm" novalidate>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit">Enter</button>
    </form>

    <p class="msg" id="loginMsg" role="status" aria-live="polite"></p>
    <button type="button" class="linkish" id="showRequest">I don&rsquo;t have a password</button>
  </section>

  <!-- ===== request access ===== -->
  <section id="request" hidden>
    <h1>No password?</h1>
    <p class="sub">Leave your name and email and we&rsquo;ll send you one.</p>

    <form id="requestForm" novalidate>
      <label for="reqName">Full name</label>
      <input id="reqName" name="name" autocomplete="name" required>

      <label for="reqEmail">Email</label>
      <input id="reqEmail" name="email" type="email" autocomplete="email" required>

      <!-- People leave this empty, bots fill it in. -->
      <div style="position:absolute;left:-9999px" aria-hidden="true">
        <label for="website">Leave this blank</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit">Send request</button>
    </form>

    <p class="msg" id="requestMsg" role="status" aria-live="polite"></p>
    <button type="button" class="linkish" id="showSignin">Back to the password</button>
  </section>

</main>

<script src="js/gate.js"></script>
<script>
(() => {
  const signin  = document.getElementById('signin');
  const request = document.getElementById('request');
  const loginForm = document.getElementById('loginForm');
  const loginMsg  = document.getElementById('loginMsg');
  const reqForm   = document.getElementById('requestForm');
  const reqMsg    = document.getElementById('requestMsg');

  const say = (el, text, tone) => { el.textContent = text; el.dataset.tone = tone || ''; };

  // Where to send them once they're in.
  //
  // Default is their own accommodation page — that is what most guests came here
  // for, and it is the one page that can't be linked to before signing in
  // because its URL depends on the group. An explicit ?next= wins, so the RSVP
  // link and the "where to stay" link still land where they pointed.
  //
  // Only ever a path on this site: ?next= comes from the URL bar, so without the
  // check it is an open redirect to anywhere.
  function safeNext() {
    const raw = new URLSearchParams(location.search).get('next');
    if (raw && /^\/(?!\/)/.test(raw)) return raw;
    return AG.stayPath() || '/';
  }

  // Already signed in? Don't make them do it twice.
  if (AG.group()) location.replace(safeNext());

  // Enter submits. The markup should give this for free — one field, one submit
  // button, inside a form — but implicit submission isn't firing here, so it is
  // wired explicitly. preventDefault first, or a browser that DOES submit
  // implicitly would run the handler twice.
  [loginForm, reqForm].forEach((f) => {
    f.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing) return;
      if (e.target.tagName === 'TEXTAREA') return;
      e.preventDefault();
      f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event('submit', { cancelable: true }));
    });
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = loginForm.querySelector('button');
    const value = document.getElementById('password').value;
    if (!value.trim()) return say(loginMsg, 'Pop the password in first.', 'bad');

    btn.disabled = true;
    say(loginMsg, 'Checking…');
    try {
      const group = await AG.login(value);
      if (!group) {
        say(loginMsg, "That's not one we recognise. Check for stray spaces, or ask us for a new one.", 'bad');
        btn.disabled = false;
        return;
      }
      say(loginMsg, 'Lovely. One moment…', 'good');
      location.replace(safeNext());
    } catch (err) {
      // The only throw is a non-secure context, where crypto.subtle is missing.
      say(loginMsg, 'This page needs a secure (https) connection to sign you in.', 'bad');
      btn.disabled = false;
    }
  });

  document.getElementById('showRequest').addEventListener('click', () => {
    signin.hidden = true; request.hidden = false;
    document.getElementById('reqName').focus();
  });
  document.getElementById('showSignin').addEventListener('click', () => {
    request.hidden = true; signin.hidden = false;
    document.getElementById('password').focus();
  });

  reqForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = reqForm.querySelector('button');
    const name = document.getElementById('reqName').value.trim();
    const email = document.getElementById('reqEmail').value.trim();
    if (!name || !email) return say(reqMsg, 'We need both, sorry.', 'bad');

    btn.disabled = true;
    say(reqMsg, 'Sending…');
    try {
      const r = await fetch('/api/access-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, website: document.getElementById('website').value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'failed');
      say(reqMsg, "Got it. We'll send your password over shortly.", 'good');
      reqForm.reset();
    } catch (err) {
      say(reqMsg, "That didn't go through. Give us a nudge on WhatsApp instead and we'll sort you out.", 'bad');
      btn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
